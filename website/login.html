<!DOCTYPE html>
<html lang="mr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KhetiSaathi | शेतकरी लॉगिन व नोंदणी</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }
    .auth-box-standalone {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 38px;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      backdrop-filter: blur(14px);
      position: relative;
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 24px;
      transition: color var(--transition-fast);
    }
    .back-home-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body class="lang-mr">

  <!-- Fixed Agricultural Farm Background Image Overlay Layer -->
  <div class="bg-agricultural-layer"></div>

  <canvas id="particle-canvas"></canvas>
  <div class="floating-color-orb orb-green-primary"></div>
  <div class="floating-color-orb orb-lime-pulse"></div>
  <div class="floating-color-orb orb-gold-harvest"></div>

  <div class="auth-page-wrapper">
    <div class="auth-box-standalone">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <a href="index.html" class="back-home-link">&larr; मुखपृष्ठावर परत जा / Back Home</a>
        
        <!-- Language Switcher -->
        <div class="lang-switcher" style="margin-bottom:20px;">
          <button class="lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
          <button class="lang-btn" data-lang="hi" onclick="switchLanguage('hi')">हिन्दी</button>
          <button class="lang-btn active" data-lang="mr" onclick="switchLanguage('mr')">मराठी</button>
        </div>
      </div>

      <div style="text-align:center; margin-bottom: 24px;">
        <div class="logo-badge" style="margin: 0 auto 12px; width:52px; height:52px; font-size:1.6rem;">🌿</div>
        <h2 style="font-size:1.6rem; font-weight:800; color:var(--text-main);" data-i18n="appName">शेतीसाथी</h2>
        <p style="font-size:0.85rem; color:var(--text-muted);" data-i18n="appSub">शेतकरी मित्र • कृषी बुद्धिमत्ता प्लॅटफॉर्म</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login" data-i18n="modalLoginTitle">शेतकरी लॉगिन</button>
        <button class="auth-tab-btn" id="tab-register" data-i18n="modalRegisterTitle">नवीन शेतकरी नोंदणी</button>
      </div>

      <!-- Quick Demo Account Shortcut -->
      <div class="demo-account-chip" id="demo-farmer-chip" title="Click to fill demo credentials">
        <span>👨‍🌾 <strong data-i18n="quickDemo">झटपट डेमो: रमेश पाटील (१२ एकर, नागपूर)</strong></span>
        <span style="font-weight:800">&rarr;</span>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="form-login">
        <div class="form-field">
          <label>मोबाईल नंबर (Mobile Number)</label>
          <input type="tel" id="login-phone" placeholder="9876543210" required>
        </div>
        <div class="form-field">
          <label>पासवर्ड (Password)</label>
          <input type="password" id="login-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;" data-i18n="submitLogin">
          लॉगिन करा व डॅशबोर्ड उघडा
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="form-register" style="display:none;">
        <div class="form-field">
          <label>पूर्ण नाव (Full Name)</label>
          <input type="text" id="reg-name" placeholder="उदा. रमेश पाटील" required>
        </div>
        <div class="form-field">
          <label>मोबाईल नंबर (Mobile)</label>
          <input type="tel" id="reg-phone" placeholder="98XXXXXXXX" required>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label>जमीन एकर (Acres)</label>
            <input type="number" id="reg-acres" placeholder="12" min="1" max="500" required>
          </div>
          <div class="form-field">
            <label>मुख्य पीक (Primary Crop)</label>
            <select id="reg-crop">
              <option value="Cotton">Cotton (कापूस)</option>
              <option value="Soybean">Soybean (सोयाबीन)</option>
              <option value="Wheat">Wheat (गहू)</option>
              <option value="Orange">Nagpur Orange (संत्रा)</option>
              <option value="Onion">Onion (कांदा)</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label>गाव व जिल्हा (Location)</label>
          <input type="text" id="reg-loc" placeholder="कळमेश्वर, नागपूर">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;" data-i18n="submitRegister">
          खाते उघडा व मोफत सुरुवात करा
        </button>
      </form>

      <div style="margin-top:20px; text-align:center; font-size:0.75rem; color:var(--text-muted);">
        🔒 सुरक्षित भारतीय सर्व्हर • आधार व PM-Kisan प्रमाणीकरण
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
